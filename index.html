<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music Visualizer</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main id="player">

        <!-- Settings -->

        <button
            id="settings-button"
            type="button"
            aria-label="Open settings"
        >
            ⚙
        </button>

        <div id="settings-menu" class="hidden">

            <h2>Appearance</h2>

            <button
                type="button"
                class="theme-button"
                data-theme="crimson"
            >
                🔴 Crimson
            </button>

            <button
                type="button"
                class="theme-button"
                data-theme="amethyst"
            >
                🟣 Amethyst
            </button>

            <div id="sensitivity-control">

                <label for="sensitivity">
                    Bar Sensitivity:
                    <span id="sensitivity-value">1.00x</span>
                </label>

                <input
                    type="range"
                    id="sensitivity"
                    min="0.25"
                    max="3"
                    step="0.05"
                    value="1"
                >

            </div>

        </div>


        <!-- Album -->

        <div id="album-art"></div>

        <div id="song-info">

            <h1 id="song-title">Song Title</h1>

            <p id="artist-name">Artist Name</p>

        </div>


        <!-- Visualizer -->

        <div id="visualizer">

            <div id="bars"></div>

        </div>


        <!-- Music Upload -->

        <input
            type="file"
            id="audio-file"
            accept="audio/*"
        >

        <label
            for="audio-file"
            id="upload-button"
        >
            Upload Music
        </label>

    </main>


    <!-- Libraries -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js">
    </script>

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.4.0/color-thief.umd.js">
    </script>

    <!-- Visualizer -->

    <script src="script.js"></script>

</body>

</html>
